name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Inject secrets into local.properties
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (arm32 only)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 50000 /tmp/build.log > /tmp/tail.log || true
          python3 - <<'PY'
          import json, os, subprocess
          body = "### Build failure log (tail)\n\n```\n" + open('/tmp/tail.log').read()[-45000:] + "\n```"
          open('/tmp/body.json','w').write(json.dumps({"body": body}))
          PY
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/body.json

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign APK
        if: steps.signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm32
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
